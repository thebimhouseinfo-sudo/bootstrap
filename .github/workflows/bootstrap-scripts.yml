name: bootstrap script regression
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test-only parsers
        run: python -m pip install tomli PyYAML
      - name: Shared verifier regression
        run: python project-template/harness/common/test_verify.py
      - name: Tier/runtime installer and adapter regression
        run: python tests/test_installer.py
      - name: Template inventory smoke
        run: python project-template/harness/common/inventory.py --tier Standard --runtime codex
