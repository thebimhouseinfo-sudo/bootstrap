name: bootstrap script regression
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test-only parsers
        run: python -m pip install tomli PyYAML
      - name: Shared verifier regression
        run: python project-template/harness/common/test_verify.py
      - name: Tier/runtime installer and adapter regression
        run: python tests/test_installer.py
      - name: Multi-host installer integration regression
        run: python tests/test_multi_harness.py
      - name: Copilot native Criteria gate regression
        run: python tests/test_copilot_hooks.py
      - name: Generic agent-generated native adapter regression
        run: python tests/test_generic_native_port.py
      - name: Host capability boundaries (Copilot and Codex Cloud)
        run: python tests/test_host_boundaries.py
      - name: Active development branch and frozen-main regression
        run: python tests/test_branch_authority.py
      - name: Codex Python hook and snapshot integration regression
        run: python tests/test_harness_runtime.py
      - name: Installed setup and adapter edge cases
        run: python tests/test_setup_smoke.py
      - name: Local agent setup excluded from target Git index
        run: python tests/test_local_ignore.py
      - name: Staged installation, hook smoke and handoff regression
        run: python tests/test_staged_setup.py
      - name: Codex hook preflight schema
        run: python project-template/harness/codex/preflight.py
      - name: Template inventory smoke
        run: python project-template/harness/common/inventory.py --tier Standard --runtime codex
