# Optional project-local working context for BOTH coder and tester.
# This is data-only; bootstrap maps it to the verified runtime.
# Omit this file entirely for generic operation.
version: 1
reload:
  on_session_start: true
  on_task_start: true
  on_project_context_change: true
  # Compare content hash/version to avoid stale loaded references.
workers:
  coder:
    skills: []        # existing verified SKILL.md paths, user-selected
    knowledge: []     # local verified reference paths/official URLs, never invented
  tester:
    skills: []
    knowledge: []
shared:
  host_profile: docs/PROJECT_PROFILE.md
  official_references: []
  verify_commands: []  # validated commands only
# Optional skill/knowledge improves first-pass accuracy; no entries is valid.
# An explicitly required project safety/compatibility constraint in PROJECT_PROFILE
# still applies even if optional supporting documents cannot be loaded.
